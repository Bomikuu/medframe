}
mutation FinalizeConsultation($organizationId: UUID!, $encounterId: UUID!, $expectedVersion: Int!) {
  finalizeEncounter(
    organizationId: $organizationId
    encounterId: $encounterId
    expectedVersion: $expectedVersion
