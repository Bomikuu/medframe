}
mutation AmendConsultation(
  $organizationId: UUID!
  $encounterId: UUID!
  $reason: String!
  $expectedFinalizedVersion: Int!
) {
  createEncounterAmendment(
    organizationId: $organizationId
    encounterId: $encounterId
    reason: $reason
    expectedFinalizedVersion: $expectedFinalizedVersion
