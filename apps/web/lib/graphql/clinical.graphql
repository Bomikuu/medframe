fragment DocumentFields on DocumentType {
  id
  documentId
  label
  version
  contentType
  size
  scanState
  createdAt
  encounterId
}
query PatientDocuments(
  $organizationId: UUID!
  $patientId: UUID
  $purpose: String!
  $before: UUID
  $versionIds: [UUID!]!
) {
  documents(
    organizationId: $organizationId
    patientId: $patientId
    purpose: $purpose
    before: $before
  ) {
    ...DocumentFields
  }
  documentVersions(
    organizationId: $organizationId
    patientId: $patientId
    versionIds: $versionIds
  ) {
    ...DocumentFields
  }
}
