fragment EncounterFields on EncounterType {
  template
  id
  patientId
  providerSpecialty
  patientName
  patientPortraitId
  branchId
  reason
  status
  version
  createdAt
  updatedAt
  content
  isAmendment
  amendmentReason
  latestFinalizedVersion
  revisionId
  editable
  patientHistoryRevisionId
  revisions {
    id
    version
    authorName
    createdAt
    amendmentReason
  }
}

query Consultations($organizationId: UUID!, $patientId: UUID, $before: UUID) {
  encounters(organizationId: $organizationId, patientId: $patientId, before: $before) {
    ...EncounterFields
  }
}
query Consultation($organizationId: UUID!, $encounterId: UUID!, $revisionId: UUID) {
  encounter(organizationId: $organizationId, encounterId: $encounterId, revisionId: $revisionId) {
    ...EncounterFields
  }
}
query ConsultationSetup($organizationId: UUID!, $patientId: UUID!) {
  providers(organizationId: $organizationId) {
    id
    displayName
    specialty
    branchId
  }
  patientDemographics(organizationId: $organizationId, patientId: $patientId) {
    id
    fullName
    reference
    branchId
  }
  patientClinicalHistory(organizationId: $organizationId, patientId: $patientId) {
    allergyState
    allergies {
      substance
      reaction
      severity
    }
    medicationState
    medications {
      name
      dose
      frequency
    }
  }
}
mutation CreateConsultation(
  $organizationId: UUID!
  $patientId: UUID!
  $providerId: UUID!
  $branchId: UUID!
  $reason: String!
  $requestId: UUID!
) {
  createEncounter(
    organizationId: $organizationId
    patientId: $patientId
    providerId: $providerId
    branchId: $branchId
    reason: $reason
    requestId: $requestId
  ) {
    ...EncounterFields
  }
}
mutation SaveConsultation(
  $organizationId: UUID!
  $encounterId: UUID!
  $content: JSON!
  $expectedVersion: Int!
) {
  updateEncounterDraft(
    organizationId: $organizationId
    encounterId: $encounterId
    content: $content
    expectedVersion: $expectedVersion
  ) {
    ...EncounterFields
  }
}
mutation TransitionConsultation(
  $organizationId: UUID!
  $encounterId: UUID!
  $status: String!
  $expectedVersion: Int!
) {
  transitionEncounter(
    organizationId: $organizationId
