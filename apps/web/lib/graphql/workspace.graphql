query WorkspaceOverview {
  currentUser {
    id
    displayName
  }
  myOrganizations {
    id
    name
  }
}
query ClinicWorkspace($organizationId: UUID!) {
  clinicWorkspace(organizationId: $organizationId) {
    organization {
      id
      name
    }
    permissions
    branches {
      id
      name
    }
  }
}
