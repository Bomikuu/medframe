[project]
name = "medframe-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "uvicorn[standard]>=0.34",
  "strawberry-graphql>=0.270",
  "redis>=5.2",
  "pydantic-settings>=2.8",
  "pwdlib[argon2]>=0.2",
  "pyotp>=2.9",
  "cryptography>=44",
  "email-validator>=2.2",
  "django>=5.2.8,<5.3",
  "strawberry-graphql-django>=0.65",
  "psycopg[binary]>=3.2",
  "celery>=5.5",
  "django-storages[s3]>=1.14",
  "pillow>=11",
  "whitenoise>=6.8",
  "channels>=4.3,<5",
  "channels-redis>=4.3,<5",
  "google-auth[requests]>=2.40,<3",
  "twilio>=9,<10",
]

[dependency-groups]
dev = [
    "daphne>=4.2,<5",
    "httpx>=0.28",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "api_graphql", "medframe_apps"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
